[project]
name = "views-reporting"
version = "0.1.0"
description = "Visualization, reporting, statistics, and mapping for the VIEWS conflict forecasting platform."
authors = [
    { name = "Dylan Pinheiro", email = "dylpin@prio.org" },
    { name = "Simon Polichinel von der Maase", email = "simmaa@prio.org" },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
# Capped <3.12: views-pipeline-core -> ingester3 -> levenshtein 0.20.9 has no
# wheel and fails to build on 3.12/3.13 (verified). Widen when upstream updates
# (risk register C-36).
requires-python = ">=3.11,<3.12"
dependencies = [
    "views-pipeline-core>=2.3.0,<3.0.0",
    # views-transformation-library removed: never imported here and already
    # pulled transitively via views-pipeline-core (falsify P3).
    "torch>=2.6.0,<3.0.0",
    "scipy>=1.15.1,<2.0.0",
    "geopandas>=1.0.1,<2.0.0",
    "seaborn>=0.13.2,<0.14.0",
    "plotly>=6.0.0,<7.0.0",
    "plotly-express>=0.4.1,<0.5.0",
    "matplotlib>=3.8,<4.0",
    "markdown>=3.8.2,<4.0.0",
    "joblib>=1.3,<2.0",
    "polars>=1.34.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/views-platform/views-reporting"
Repository = "https://github.com/views-platform/views-reporting"

[tool.uv]
# Scope universal resolution to the platforms views-reporting actually runs on.
# Excludes the Windows-only pywin32/docker branch pulled in transitively via
# views-pipeline-core -> viewser.
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["views_reporting"]

[tool.hatch.build.targets.sdist]
include = ["/views_reporting", "/README.md", "/LICENSE"]

[dependency-groups]
dev = [
    # pinned <9 to stay compatible with views-pipeline-core's pytest<9 runtime
    # constraint (uv lock surfaced the conflict the poetry setup hid)
    "pytest>=8.3.3,<9.0.0",
    "ruff",
]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"views_reporting/reports/report.py" = ["E501"]
"views_reporting/reports/styles/tailwind.py" = ["E501"]
"views_reporting/reports/utils.py" = ["E501"]
"views_reporting/statistics/dataset_statistics.py" = ["E501"]
"views_reporting/reconciliation/reconciliation.py" = ["E501"]
"views_reporting/reconciliation/dataset_export.py" = ["E501"]
"views_reporting/templates/reports/evaluation.py" = ["E501"]
"views_reporting/templates/reports/forecast.py" = ["E501"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning", "ignore::RuntimeWarning", "ignore::UserWarning"]
testpaths = ["tests"]
